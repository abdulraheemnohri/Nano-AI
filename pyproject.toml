[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-ai"
version = "0.5.0"
description = "Nano AI local Qwen3 4B-Thinking-2507 assistant"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
voice = ["vosk>=0.3.45", "sounddevice>=0.5", "piper-tts>=1.2.0"]
browser = ["playwright>=1.48"]
desktop = ["pyautogui>=0.9.54", "pillow>=10"]
test = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
nano-ai = "nano.cli:main"

[tool.setuptools.packages.find]
include = ["nano", "nano.*"]
exclude = ["data", "models", "skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
nano = ["static/*.html", "static/*.css", "static/*.js"]
