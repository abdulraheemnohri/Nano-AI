name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to validate (must match pyproject.toml)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate on \${{ matrix.os }}
    runs-on: \${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: \${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify tag matches package version
        shell: python
        env:
          RELEASE_TAG: \${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Expected a stable version tag like v0.5.0, got {tag!r}")
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match pyproject.toml version {version}")
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Check standalone UI JavaScript syntax
        run: node --check nano/static/app.js
      - name: Run test suite
        run: python -m pytest -q

  build:
    name: Build and verify distributions
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: \${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build source and wheel
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: nano-ai-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: nano-ai-distributions
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: \${{ github.ref_name }}
          name: Nano AI \${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
